<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Área da profissional</title>

    <link rel="stylesheet" href="/css/style.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<main class="pagina-login">

    <header class="cabecalho-mobile">

        <a href="/" class="botao-menu" aria-label="Voltar para o início">
            <i class="bi bi-chevron-left"></i>
        </a>

        <div class="marca">

            <div class="marca-icone">
                <i class="bi bi-flower1"></i>
            </div>

            <div class="marca-texto">
                <strong>Massoterapia</strong>
                <span>Área profissional</span>
            </div>

        </div>

        <div class="espaco-cabecalho"></div>

    </header>

    <section class="conteudo-login">

        <div class="apresentacao-login">

            <div class="icone-login">
                <i class="bi bi-person-lock"></i>
            </div>

            <h1>Área da profissional</h1>

            <div class="linha-destaque"></div>

            <p>
                Entre com seu usuário e senha para acessar o painel.
            </p>

        </div>

        <div th:if="${erro}"
             class="mensagem mensagem-erro">

            <i class="bi bi-exclamation-circle-fill"></i>

            <span th:text="${erro}"></span>

        </div>

        <form action="/login"
              method="post"
              class="form-login">

            <div class="campo">

                <label for="usuario">
                    Usuário
                </label>

                <div class="input-icon">

                    <i class="bi bi-person"></i>

                    <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Digite seu usuário"
                            autocomplete="username"
                            required>

                </div>

            </div>

            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <div class="input-icon campo-senha">

                    <i class="bi bi-lock"></i>

                    <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required>

                    <button
                            type="button"
                            class="botao-mostrar-senha"
                            id="botaoMostrarSenha"
                            aria-label="Mostrar senha">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>

            <button type="submit"
                    class="btn-entrar">

                <i class="bi bi-box-arrow-in-right"></i>

                Entrar

            </button>

        </form>

        <aside class="card-seguranca">

            <i class="bi bi-shield-lock"></i>

            <div>

                <strong>Acesso restrito</strong>

                <p>
                    Esta área é exclusiva para a profissional responsável.
                </p>

            </div>

        </aside>

    </section>

    <nav class="navegacao-inferior">

        <a href="/agendar" class="item-navegacao">

            <i class="bi bi-calendar-plus"></i>

            <span>Agendar</span>

        </a>

        <a href="/consultar" class="item-navegacao">

            <i class="bi bi-search"></i>

            <span>Consultar</span>

        </a>

        <a href="/login" class="item-navegacao ativo">

            <i class="bi bi-person"></i>

            <span>Profissional</span>

        </a>

    </nav>

</main>

<script>

    const campoSenha = document.getElementById("senha");
    const botaoMostrarSenha = document.getElementById("botaoMostrarSenha");
    const iconeSenha = botaoMostrarSenha.querySelector("i");

    botaoMostrarSenha.addEventListener("click", function () {

        const senhaVisivel = campoSenha.type === "text";

        campoSenha.type = senhaVisivel ? "password" : "text";

        iconeSenha.className = senhaVisivel
            ? "bi bi-eye"
            : "bi bi-eye-slash";

        botaoMostrarSenha.setAttribute(
            "aria-label",
            senhaVisivel ? "Mostrar senha" : "Ocultar senha"
        );

    });

</script>

<script>

    setTimeout(() => {

        const mensagens = document.querySelectorAll(
            ".pagina-login .mensagem-erro"
        );

        mensagens.forEach(mensagem => {

            mensagem.classList.add("mensagem-escondendo");

            setTimeout(() => {
                mensagem.remove();
            }, 500);

        });

    }, 3000);

</script>

</body>
</html>
