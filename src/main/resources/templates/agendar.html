<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agendar horário</title>

    <link rel="stylesheet" href="/css/style.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<main class="pagina-agendamento">

    <!-- Cabeçalho -->
    <header class="cabecalho-mobile">

        <a href="/" class="botao-menu" aria-label="Voltar para o início">
            <i class="bi bi-list"></i>
        </a>

        <div class="marca">
            <div class="marca-icone">
                <i class="bi bi-flower1"></i>
            </div>

            <div class="marca-texto">
                <strong>Massoterapia</strong>
                <span>Agende seu horário</span>
            </div>
        </div>

        <div class="espaco-cabecalho"></div>

    </header>

    <section class="conteudo-agendamento">

        <!-- Apresentação -->
        <div class="apresentacao">

            <div class="icone-apresentacao">
                <i class="bi bi-calendar-heart"></i>
            </div>

            <h1>Agende seu horário</h1>

            <div class="linha-destaque"></div>

            <p>
                Preencha os dados abaixo para realizar seu agendamento.
            </p>

        </div>

        <!-- Mensagens -->
        <div th:if="${sucesso}"
             class="mensagem mensagem-sucesso">

            <i class="bi bi-check-circle-fill"></i>

            <span th:text="${sucesso}"></span>

        </div>

        <div th:if="${erro}"
             class="mensagem mensagem-erro">

            <i class="bi bi-exclamation-circle-fill"></i>

            <span th:text="${erro}"></span>

        </div>

        <!-- Formulário -->
        <form action="/salvar"
              method="post"
              class="form-agendamento">

            <div class="campo">

                <label for="nome">
                    Nome completo
                </label>

                <div class="input-icon">

                    <i class="bi bi-person"></i>

                    <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            autocomplete="name"
                            required>

                </div>

            </div>

            <div class="campo">

                <label for="telefone">
                    Telefone
                </label>

                <div class="input-icon">

                    <i class="bi bi-telephone"></i>

                    <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(00) 00000-0000"
                            autocomplete="tel"
                            required>

                </div>

            </div>

            <div class="campo">

                <label for="servico">
                    Tipo de massagem
                </label>

                <div class="input-icon">

                    <i class="bi bi-flower1"></i>

                    <select id="servico"
                            name="servico"
                            required>

                        <option value="" selected disabled>
                            Selecione o tipo de massagem
                        </option>

                        <option
                                th:each="servico : ${servicos}"
                                th:value="${servico.nomeServico}"
                                th:text="${servico.preco != null
                                    ? servico.nomeServico
                                    + ' — R$ '
                                    + #numbers.formatDecimal(
                                    servico.preco,
                                    1,
                                    'POINT',
                                    2,
                                    'COMMA'
                                )
                                : servico.nomeServico
                                + ' — preço não informado'}">
                        </option>

                    </select>

                </div>

            </div>

            <div class="campo">

                <label for="data">
                    Data
                </label>

                <div class="input-icon">

                    <i class="bi bi-calendar-event"></i>

                    <input
                            type="date"
                            id="data"
                            name="data"
                            required>

                </div>

            </div>

            <div class="campo">

                <label for="horario">
                    Horário
                </label>

                <div class="input-icon">

                    <i class="bi bi-clock"></i>

                    <select
                            id="horario"
                            name="horario"
                            disabled
                            required>

                        <option value="" selected disabled>
                            Primeiro selecione uma data
                        </option>

                    </select>

                </div>

            </div>

            <button class="btn-confirmar"
                    type="submit">

                <i class="bi bi-calendar-check"></i>

                Agendar horário

            </button>

        </form>

        <!-- Aviso -->
        <aside class="card-aviso">

            <div class="aviso-titulo">

                <i class="bi bi-info-circle"></i>

                <strong>Importante</strong>

            </div>

            <p>
                Chegue com alguns minutos de antecedência para aproveitar
                melhor o seu atendimento.
            </p>

        </aside>

    </section>

    <!-- Navegação inferior -->
    <nav class="navegacao-inferior">

        <a href="/agendar" class="item-navegacao ativo">

            <i class="bi bi-calendar-plus"></i>

            <span>Agendar</span>

        </a>

        <a href="/consultar" class="item-navegacao">

            <i class="bi bi-search"></i>

            <span>Consultar</span>

        </a>

        <a href="/login" class="item-navegacao">

            <i class="bi bi-person"></i>

            <span>Profissional</span>

        </a>

    </nav>

</main>

<script>

    const campoData = document.getElementById("data");
    const selectHorario = document.getElementById("horario");

    campoData.addEventListener("change", function () {

        selectHorario.disabled = true;

        selectHorario.innerHTML = `
            <option value="" selected disabled>
                Carregando horários...
            </option>
        `;

        fetch("/horarios?data=" + campoData.value)

            .then(response => {

                if (!response.ok) {
                    throw new Error("Não foi possível buscar os horários.");
                }

                return response.json();

            })

            .then(horarios => {

                selectHorario.innerHTML = "";

                if (horarios.length === 0) {

                    selectHorario.innerHTML = `
                        <option value="" selected disabled>
                            Nenhum horário disponível
                        </option>
                    `;

                    selectHorario.disabled = true;

                    return;
                }

                const opcaoInicial = document.createElement("option");

                opcaoInicial.value = "";
                opcaoInicial.textContent = "Selecione o horário";
                opcaoInicial.selected = true;
                opcaoInicial.disabled = true;

                selectHorario.appendChild(opcaoInicial);

                horarios.forEach(horario => {

                    const option = document.createElement("option");

                    option.value = horario;
                    option.textContent = horario;

                    selectHorario.appendChild(option);

                });

                selectHorario.disabled = false;

            })

            .catch(() => {

                selectHorario.innerHTML = `
                    <option value="" selected disabled>
                        Erro ao carregar os horários
                    </option>
                `;

                selectHorario.disabled = true;

            });

    });

</script>

<script>

    setTimeout(() => {

        const mensagens = document.querySelectorAll(
            ".mensagem-sucesso, .mensagem-erro"
        );

        mensagens.forEach(mensagem => {

            mensagem.classList.add("mensagem-escondendo");

            setTimeout(() => {
                mensagem.remove();
            }, 500);

        });

    }, 3000);

</script>

</body>
</html>
