<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Novo Serviço</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/novo-servico.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<main class="pagina-novo-servico">

    <header class="cabecalho-novo-servico">

        <a th:href="@{/servicos}"
           class="botao-voltar-servico"
           aria-label="Voltar">

            <i class="bi bi-chevron-left"></i>

        </a>

        <div class="marca-servico">

            <div class="icone-marca-servico">

                <i class="bi bi-flower1"></i>

            </div>

            <div class="texto-marca-servico">

                <strong>Novo Serviço</strong>

                <span>Cadastro</span>

            </div>

        </div>

        <div class="espaco"></div>

    </header>

    <section class="conteudo-novo-servico">

        <div class="cabecalho-formulario">

            <span>Novo cadastro</span>

            <h1>Cadastrar serviço</h1>

            <p>
                Informe o nome do serviço que ficará disponível para agendamento.
            </p>

        </div>

        <!-- Mensagem de sucesso -->
        <div th:if="${sucesso}" class="mensagem-sucesso">

            <i class="bi bi-check-circle-fill"></i>

            <span th:text="${sucesso}"></span>

        </div>

        <!-- Mensagem de erro -->
        <div th:if="${erro}" class="mensagem-erro">

            <i class="bi bi-exclamation-circle-fill"></i>

            <span th:text="${erro}"></span>

        </div>

        <form th:action="@{/servicos/salvar}"
              method="post">

            <div class="card-formulario">

                <div class="campo">

                    <label for="nomeServico">
                        Nome do serviço
                    </label>

                    <div class="input-servico">

                        <i class="bi bi-flower1"></i>

                        <input
                                id="nomeServico"
                                type="text"
                                name="nomeServico"
                                placeholder="Ex.: Massagem Relaxante"
                                autocomplete="off"
                                required>

                    </div>

                </div>

            </div>

            <div class="card-aviso-servico">

                <i class="bi bi-lightbulb"></i>

                <span>
                    Utilize um nome claro e objetivo para facilitar a escolha do cliente.
                </span>

            </div>

            <div class="botoes-servico">

                <button type="submit"
                        class="btn-salvar-servico">

                    <i class="bi bi-check-circle"></i>

                    Salvar serviço

                </button>

                <a th:href="@{/servicos}"
                   class="btn-cancelar-servico">

                    <i class="bi bi-x-circle"></i>

                    Cancelar

                </a>

            </div>

        </form>

    </section>

</main>

<script>

    setTimeout(() => {

        const mensagens = document.querySelectorAll(
            ".mensagem-sucesso, .mensagem-erro"
        );

        mensagens.forEach(mensagem => {

            mensagem.style.opacity = "0";

            setTimeout(() => {
                mensagem.remove();
            }, 500);

        });

    }, 3000);

</script>

</body>

</html>
