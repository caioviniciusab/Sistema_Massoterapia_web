<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Consultar Agendamento</title>

    <link rel="stylesheet" href="/css/style.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div class="container">

    <div class="mensagem-erro" th:if="${mensagem}">
        <i class="bi bi-exclamation-circle-fill"></i>
        <p th:text="${mensagem}"></p>
    </div>


    <h1>Consultar Agendamento</h1>

    <form action="/consultar" method="post">

        <div class="campo">

            <label>Telefone</label>

            <input
                    type="text"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required>

        </div>

        <a type="submit">
            <button>Buscar</button>
        </a>

        <a href="/" class="btn-voltar">
            Voltar
        </a>

    </form>

    <hr>

    <div th:each="agendamento : ${agendamentos}" class="card-agendamento">

        <h3>
            <i class="bi bi-flower1"></i>
            <span th:text="${agendamento.servico.nomeServico}"></span>
        </h3>

        <p>
            <i class="bi bi-calendar-event"></i>
            <strong>Data:</strong>
            <span th:text="${#temporals.format(agendamento.data,'dd/MM/yyyy')}"></span>
        </p>

        <p>
            <i class="bi bi-clock"></i>
            <strong>Horário:</strong>
            <span th:text="${#temporals.format(agendamento.data,'HH:mm')}"></span>
        </p>

        <p>
            <i class="bi bi-check-circle-fill"></i>
            <strong>Status:</strong>

            <span
                    th:text="${agendamento.status}"
                    th:classappend="${agendamento.status == 'AGENDADO'} ? 'status-agendado' :
                            (${agendamento.status == 'CANCELADO'} ? 'status-cancelado' : 'status-concluido')">
                <form
                        th:if="${agendamento.status == 'AGENDADO'}"
                        th:action="@{/cancelar/{id}(id=${agendamento.id})}"
                        method="post"
                        onsubmit="return confirmarCancelamento()">

                        <button class="btn-cancelar" type="submit">
                            Cancelar Agendamento
                        </button>
                </form>
        </span>

        </p>

    </div>

</div>

<script>

    function confirmarCancelamento() {

        return confirm(
            "Tem certeza que deseja cancelar este agendamento?"
        );

    }

</script>

</body>
</html>
